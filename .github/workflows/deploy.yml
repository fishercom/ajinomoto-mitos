# Despliegue del tema ajinomoto-mitos a EC2 vía AWS SSM (sin SSH ni llaves).
# GitHub se autentica en AWS con OIDC (ver deploy/aws-setup.md).
#
# Secrets/variables requeridos (Settings > Secrets and variables > Actions):
#   AWS_ROLE_ARN     ARN del rol IAM que asume GitHub
#   EC2_INSTANCE_ID  i-0658016bbbccf151f
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/ajinomoto-mitos/**'
      - 'deploy/mitos-deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  THEME_PATH: wp-content/themes/ajinomoto-mitos
  AWS_REGION: us-east-1
  PHP_VERSION: '8.3'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: PHP lint
        run: find "$THEME_PATH" -name '*.php' -type f -print0 | xargs -0 -n 1 php -l > /dev/null

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "commands=[\"/usr/local/bin/mitos-deploy $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          # wait devuelve error si el comando falla; igual mostramos la salida antes de salir
          status=0
          aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" || status=$?

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output yaml
          exit $status
